name: site

# Builds and publishes the Turnpike site to GitHub Pages.
#
# The site is static: no CMS, no server, no runtime data fetching. Everything it
# claims is either a link to a block explorer or a figure taken from a CI
# artifact in this repository.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: npm --prefix site ci

      - name: Build
        # Primary hosting is Vercel (see site/vercel.json); this Pages deploy is
        # a fallback served from the project-page path, so it needs that base.
        env:
          SITE_BASE: /turnpike/
        run: npm --prefix site run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
